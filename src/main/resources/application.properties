spring.application.name=GreenCar

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webMarketUsers}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

# Dialect не указываем явно — Hibernate сам определит по JDBC URL
# (PostgreSQL для prod, H2 для теста). Так избегаем рассогласования
# между основным application.properties и application-test.properties.

spring.data.rest.base-path=/data-api

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
